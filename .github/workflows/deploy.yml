name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload files to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude '*.pem' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "$SSH_USER@$SSH_HOST:~/doc-to-pdf/"

      - name: Build and restart container
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" '
            set -e
            cd ~/doc-to-pdf
            sudo docker build -t pdfly .
            sudo docker rm -f pdfly || true
            sudo docker run -d --name pdfly --restart unless-stopped -p 80:8000 pdfly
            sudo docker image prune -f
          '

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          sleep 5
          curl --fail --silent --show-error "http://$SSH_HOST/health"
